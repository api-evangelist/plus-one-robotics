aid: plus-one-robotics
name: Plus One Robotics
description: 'Plus One Robotics is a San Antonio, Texas warehouse-automation company
  founded in 2016 by Erik Nieves and Shaun Edwards that builds AI-powered computer-vision
  software and robotic work cells for parcel handling, depalletizing, palletizing and
  induction. Its PickOne perception system tells a robot arm how to grasp each item
  and verifies placement, while Yonder provides supervised autonomy — remote human
  "Crew Chiefs" who take over when the robot hits an exception. Packaged work cells
  DepalOne and InductOne wrap that stack in deployable hardware. The company reports
  more than 1.5 billion lifetime picks across robots fielded in 15 countries, with
  additional offices in Eindhoven (Netherlands) and Boulder, Colorado. Plus One
  Robotics publishes no public developer program, API documentation or machine-readable
  API contract; product integration is handled through its partner channel and a
  login-gated partner portal.'
